name: CI

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ${{ matrix.os[0] }}
    strategy:
      matrix:
        os: [
          [macos-latest, arm64],
          [macos-15-intel, x86_64],
          [ubuntu-latest, x86_64],
          [windows-latest, x86_64],
        ]
        
    steps:       
    - uses: actions/checkout@v4

    - name: Install MSYS2 packages
      if: matrix.os[0] == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        install: |
          base-devel mingw-w64-i686-gcc
        update: true

    - name: Compile native versions
      run: |
        make -j $(getconf _NPROCESSORS_ONLN) clean 
        make -j $(getconf _NPROCESSORS_ONLN) all

    - name: Run native C regression tests
      if: matrix.os[0] != 'windows-latest'
      run: make check

    - name: Run native Windows C smoke tests
      if: matrix.os[0] == 'windows-latest'
      run: make -f Makefile.mingw32 check
        
    - name: Get short SHA
      id: slug
      run: printf '%s\n' "sha8=$(printf '%s\n' ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Create tar archive (keep executable bit)
      run: tar -zcvf ps2client-${{ steps.slug.outputs.sha8 }}-${{ matrix.os[0] }}-${{ matrix.os[1] }}.tar.gz bin
        
    - uses: actions/upload-artifact@v4
      with:
        name: ps2client-${{ steps.slug.outputs.sha8 }}-${{ matrix.os[0] }}-${{ matrix.os[1] }}
        path: |
          *tar.gz

  integration-linux:
    name: Linux PS2Link protocol integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - name: Build client and native C fake-PS2Link server
      run: make -j2 all bin/fake_ps2link bin/crc32
    - name: Run full network-namespace integration suite
      run: |
        # Keep virtual interfaces and UDP ports off the runner's host network.
        # GitHub-hosted Linux runners permit root-owned network namespaces.
        sudo unshare --net -- env PS2CLIENT_TEST_NS=1 \
          bash tests/run-tests.sh "$GITHUB_WORKSPACE/bin/ps2client"

  build-win:
    runs-on: ubuntu-latest
    container: dockcross/windows-static-x86:latest
    
    steps:       
    - uses: actions/checkout@v4

    - name: Compile windows version with cross-compilator
      run: |
        make -f Makefile.mingw32 -j $(getconf _NPROCESSORS_ONLN) clean 
        make -f Makefile.mingw32 -j $(getconf _NPROCESSORS_ONLN) all
        
    - name: Get short SHA
      id: slug
      run: printf '%s\n' "sha8=$(printf '%s\n' ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Create tar archive
      run: tar -zcvf ps2client-${{ steps.slug.outputs.sha8 }}-windows-latest-x86_64.tar.gz bin
        
    - uses: actions/upload-artifact@v4
      with:
        name: ps2client-${{ steps.slug.outputs.sha8 }}-windows-latest-x86_64
        path: |
          *tar.gz
          
  release:
    needs: [build, build-win, integration-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v4
    
    - name: Get short SHA
      id: slug
      run: printf '%s\n' "sha8=$(printf '%s\n' ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT
      
    - name: Download Mac x86_64 artifact
      uses: actions/download-artifact@v4
      with:
        name: ps2client-${{ steps.slug.outputs.sha8 }}-macos-15-intel-x86_64

    - name: Download Mac arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: ps2client-${{ steps.slug.outputs.sha8 }}-macos-latest-arm64

    - name: Download Ubuntu artifact
      uses: actions/download-artifact@v4
      with:
        name: ps2client-${{ steps.slug.outputs.sha8 }}-ubuntu-latest-x86_64

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: ps2client-${{ steps.slug.outputs.sha8 }}-windows-latest-x86_64

    - name: Create pre-release
      if: github.ref == 'refs/heads/master'
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: true
        automatic_release_tag: "latest"
        title: "Development build"
        files: |
          *tar.gz
          
    - name: Create Tagged Release Draft
      if: startsWith(github.ref, 'refs/tags/v')
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        draft: true
        files: |
          *tar.gz
